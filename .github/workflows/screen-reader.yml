name: Screen readers

# A6 (docs/accessibility/): drives the debug app with a real screen reader through Guidepup and
# checks what it says along the M6 editing and M7 formula-bar journeys
# (scripts/app-checks/screen-reader.mjs; docs/ci.md#screen-readers; ADR-0030). NVDA on Windows
# gates the job; VoiceOver on macOS and Orca on Linux are informational (continue-on-error).
# Narrator has no automation API: its evidence is the UI Automation tree (scripts/app-checks/uia.ps1).
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/screen-reader.yml'
      - 'scripts/app-checks/screen-reader.mjs'
      - 'app/src/**'
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  GUIDEPUP_VERSION: 0.40.0
  GUIDEPUP_SETUP_VERSION: 0.29.3

jobs:
  screen-reader:
    name: ${{ matrix.reader }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    continue-on-error: ${{ matrix.informational }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            reader: NVDA
            informational: false
          # Informational until its misses are fixed (docs/accessibility/m7-formula-bar.md#a6-screen-reader-runs):
          # it does not read the suggestion count or the active suggestion, and no VoiceOver
          # command reads the window title.
          - os: macos-15
            reader: VoiceOver
            informational: true
          # @guidepup/setup installs Orca on Ubuntu 26.04 or later only.
          - os: ubuntu-26.04
            reader: Orca
            informational: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev patchelf

      - name: Install Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install || rustup show
          rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: screen-reader
          save-if: ${{ github.event_name != 'pull_request' }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci

      # Runs `npm run build` first (beforeBuildCommand), which tauri::generate_context!() embeds.
      - name: Build the debug app
        working-directory: app
        run: npx tauri build --debug --no-bundle

      - name: Install Guidepup
        shell: bash
        run: |
          mkdir -p target/tmp/screen-reader/tools
          cd target/tmp/screen-reader/tools
          npm init -y > /dev/null
          npm install --no-audit --no-fund "@guidepup/guidepup@$GUIDEPUP_VERSION" "@guidepup/setup@$GUIDEPUP_SETUP_VERSION"

      # setup (macOS, Linux): AppleScript control of VoiceOver, the TCC database, no Do Not
      # Disturb; Orca, Xvfb, D-Bus and xdotool. install (every OS): the reader's assets in
      # Guidepup's cache (portable NVDA, VoiceOver and Orca settings), which start() needs.
      - name: Set up the screen reader
        shell: bash
        working-directory: target/tmp/screen-reader/tools
        run: |
          if [ "$RUNNER_OS" != Windows ]; then
            npx --no-install guidepup setup --ci
          fi
          npx --no-install guidepup install

      # Tab reaches every control (buttons too), as with Keyboard navigation on in System Settings.
      - name: Full keyboard access (macOS)
        if: runner.os == 'macOS'
        run: defaults write NSGlobalDomain AppleKeyboardUIMode -int 3

      # Its own limit, so a stuck reader still leaves the report to upload.
      - name: Run the screen-reader journey
        shell: bash
        timeout-minutes: 45
        env:
          GUIDEPUP_DIR: ${{ github.workspace }}/target/tmp/screen-reader/tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" node scripts/app-checks/screen-reader.mjs
          else
            node scripts/app-checks/screen-reader.mjs
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screen-reader-${{ matrix.reader }}
          path: |
            target/tmp/screen-reader/run/report.json
            target/tmp/screen-reader/run/report.md
            target/tmp/screen-reader/run/app.log
            target/tmp/screen-reader/run/*.png
          if-no-files-found: warn
