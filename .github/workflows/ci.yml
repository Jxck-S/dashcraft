name: CI

# Skipped when a change touches only docs, images under docs/ or the release/fuzz/Dependabot
# configuration. Later patterns win: the files tests read (generated docs, crate docs and
# prompts, fixtures, the license inventory) still run CI. `main` has no required checks, so a
# skipped run blocks nothing; "Run workflow" runs it on demand.
on:
  push:
    branches: [main]
    paths: &code-paths
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!.github/workflows/release.yml'
      - '!.github/workflows/fuzz.yml'
      - '!.github/dependabot.yml'
      - 'docs/COMMANDS.md'
      - 'docs/AI.md'
      - 'crates/**'
      - 'reference/**'
      - 'THIRD_PARTY_NOTICES.md'
  pull_request:
    branches: [main]
    paths: *code-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # Keep file:line in backtraces but shrink target/ (and the cache) considerably.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup set profile minimal
          # rustup >= 1.28 installs the toolchain + components pinned in
          # rust-toolchain.toml; older rustup installs it on `rustup show`.
          rustup toolchain install || rustup show
          rustc --version && cargo --version

      - name: Faster Windows test linking
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $linker = Join-Path (rustc --print sysroot) 'lib/rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe'
          if (!(Test-Path -LiteralPath $linker)) { throw "Bundled Rust LLD linker is missing: $linker" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_PROFILE_DEV_DEBUG=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_PROFILE_TEST_DEBUG=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: mozilla-actions/sccache-action@v0.0.11
        id: sccache
        with:
          version: "v0.16.0"
          disable_annotations: true

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151

      - name: cargo fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      # Cargo commands without --workspace act on the
      # workspace's default-members (crates/*), which excludes the Tauri app
      # (needs webview system libraries; covered by the `app` job). This guard
      # fails if any *other* member is missing from default-members, so nothing
      # is silently skipped.
      - name: Check default-members cover the workspace
        if: runner.os == 'Linux'
        shell: bash
        run: |
          skipped=$(cargo metadata --format-version 1 --no-deps --locked \
            | jq -r '. as $m
                | ($m.workspace_members - $m.workspace_default_members) as $ids
                | $m.packages[] | select(.id as $id | $ids | index($id)) | .name' \
            | grep -vx 'dashcraft-app' || true)
          if [ -n "$skipped" ]; then
            echo "::error::Workspace members missing from default-members (not linted/tested by CI): $skipped"
            exit 1
          fi

      # Crate dependency direction (docs/ARCHITECTURE.md, xtask/src/layers.rs): no upward or
      # unlisted same-layer edges, no UI toolkit outside dashcraft-app. `cargo metadata` covers
      # every platform, so one OS is enough.
      - name: Architecture layers (cargo xtask layers)
        if: runner.os == 'Linux'
        run: cargo xtask layers

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo nextest
        id: tests
        env:
          RUSTC_WORKSPACE_WRAPPER: sccache
        run: cargo nextest run --locked --no-fail-fast

      - name: cargo test (doctests)
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        env:
          RUSTC_WORKSPACE_WRAPPER: sccache
        run: cargo test --doc --locked --no-fail-fast

      - name: Compiler cache statistics
        if: ${{ !cancelled() && steps.sccache.outcome == 'success' }}
        shell: bash
        run: |
          {
            echo '### Compiler cache (${{ runner.os }})'
            echo '```text'
            sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Performance budgets (perf/budgets.toml, docs/perf.md). Informational: shared runners are
  # slower and noisier than the baseline machine and have no gitignored data, so results are
  # reported (job summary + artifact) but never fail the workflow.
  perf:
    name: Performance budgets (informational)
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install || rustup show
          rustc --version && cargo --version

      # Release artifacts: a cache of their own, apart from the debug builds of `rust`.
      - uses: Swatinem/rust-cache@v2
        with:
          key: perf
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo xtask perf --quick
        run: cargo xtask perf --quick --no-fail --locked

      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [ -f target/perf/report.md ]; then
            cat target/perf/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-report
          path: target/perf/
          retention-days: 14
          if-no-files-found: warn

  detect:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.detect.outputs.app }}
      rust: ${{ steps.detect.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          mkdir -p target/tmp/actionlint
          curl --fail --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o target/tmp/actionlint.tar.gz
          echo "$ACTIONLINT_SHA256  target/tmp/actionlint.tar.gz" | sha256sum --check
          tar -xzf target/tmp/actionlint.tar.gz -C target/tmp/actionlint actionlint
          echo "$PWD/target/tmp/actionlint" >> "$GITHUB_PATH"
      - name: Validate CI workflow and change selection
        run: |
          actionlint .github/workflows/ci.yml .github/workflows/screen-reader.yml
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - id: detect
        env:
          BASE_SHA: ${{ github.event_name != 'workflow_dispatch' && (github.event.pull_request.base.sha || github.event.before) || '' }}
        run: python3 -B .github/scripts/ci_scope.py

  app:
    name: App (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev patchelf

      - name: Install Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install || rustup show
          rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: app
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci

      - name: npm run check
        working-directory: app
        run: npm run check --if-present

      # Also produces app/dist, which tauri::generate_context!() embeds at compile time.
      - name: npm run build
        working-directory: app
        run: npm run build

      # Non-blocking: dependency bumps (Dependabot) would otherwise all fail here. The release
      # workflow regenerates the inventory anyway; this only reminds to commit it.
      - name: License inventory up to date (THIRD_PARTY_NOTICES.md)
        if: runner.os == 'Linux'
        run: |
          if ! python3 scripts/license-inventory.py --check; then
            echo "::warning file=THIRD_PARTY_NOTICES.md::License inventory is stale; run scripts/license-inventory.py and commit the result."
          fi

      - name: cargo clippy (dashcraft-app)
        if: hashFiles('app/src-tauri/Cargo.toml') != ''
        run: cargo clippy -p dashcraft-app --all-targets --locked -- -D warnings

  deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # A newly published RustSec advisory should not block unrelated PRs; it is
    # still reported (annotations + red job) and the nightly/PR author can act.
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
