[package]
name = "pbi-ai"
description = "Opt-in AI capability contract and provider adapters, exposed as registry commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
pbi-ops = { workspace = true }
pbi-session = { workspace = true }
pbi-model = { workspace = true }
pbi-dax = { workspace = true }
pbi-engine = { workspace = true }
chrono = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
# The only HTTP client and keychain in the workspace (network containment: `cargo xtask layers`).
ureq = { workspace = true }
keyring = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
